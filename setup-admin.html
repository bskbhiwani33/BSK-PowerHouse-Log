<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSK - One-time Admin Setup</title>
<style>
  body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;padding:24px;color:#172033}
  main{max-width:440px;margin:30px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 18px #0001}
  h2{margin-top:0} label{display:block;margin:16px 0 6px;font-weight:600}
  input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbc3cf;border-radius:7px;font-size:16px}
  button{width:100%;margin-top:20px;padding:13px;background:#174ea6;color:#fff;border:0;border-radius:7px;font-size:16px}
  #message{margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}
  .note{font-size:13px;color:#596579;line-height:1.5}
</style>
</head>
<body>
<main>
  <h2>BSK Admin Setup</h2>
  <p class="note">Create the first Admin account. Enter your setup secret and PIN only on this page. This page does not save them.</p>
  <form id="setupForm">
    <label for="userId">Admin User ID</label>
    <input id="userId" autocomplete="off" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_-]{3,40}">
    <label for="pin">4-digit PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="new-password" required pattern="[0-9]{4}" maxlength="4">
    <label for="secret">ADMIN_SETUP_KEY (Secret)</label>
    <input id="secret" type="password" autocomplete="off" required>
    <button id="submitBtn" type="submit">Create Admin Account</button>
  </form>
  <div id="message" role="status"></div>
</main>
<script>
const form = document.getElementById("setupForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const userId = document.getElementById("userId").value.trim();
  const pin = document.getElementById("pin").value;
  const setupSecret = document.getElementById("secret").value;

  if (!/^[A-Za-z0-9_-]{3,40}$/.test(userId)) {
    message.textContent = "User ID must be 3-40 characters: letters, numbers, _ or -.";
    return;
  }
  if (!/^[0-9]{4}$/.test(pin)) {
    message.textContent = "PIN must contain exactly 4 digits.";
    return;
  }

  button.disabled = true;
  message.textContent = "Creating Admin account...";
  try {
    const response = await fetch("/.netlify/functions/create-admin", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({userId, pin, setupSecret})
    });
    const result = await response.json().catch(() => ({}));
    if (response.ok && result.success) {
      message.textContent = "SUCCESS: Admin account created. Now remove ADMIN_SETUP_KEY from Netlify and redeploy. Then delete this setup page from the website.";
      form.reset();
    } else {
      message.textContent = "Error: " + (result.error || ("Request failed (" + response.status + ")"));
    }
  } catch (error) {
    message.textContent = "Could not contact the setup service. Check that the site has finished deploying.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
