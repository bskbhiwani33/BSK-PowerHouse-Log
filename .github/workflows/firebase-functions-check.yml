name: Firebase Functions validation

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - "scripts/**"
      - "package.json"
      - "bsk-release.json"
      - "app.js"
      - "index.html"
      - "style.css"
      - "bsk-config.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "android-app/**"
      - ".github/workflows/firebase-functions-check.yml"
  push:
    branches:
      - bsk-firebase-functions-prep
    paths:
      - "functions/**"
      - "firebase.json"
      - "scripts/**"
      - "package.json"
      - "app.js"
      - "index.html"
      - "style.css"
      - "bsk-config.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "android-app/**"
      - ".github/workflows/firebase-functions-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web asset build dependencies
        run: npm install --no-audit --no-fund
      - name: Build Firebase Hosting assets
        run: npm run build:hosting
      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Check handler syntax
        working-directory: functions
        run: npm run check
      - name: Check frontend/backend API contract
        run: node scripts/check-api-contract.mjs

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build local Firebase asset bundle
        run: |
          npm install --no-audit --no-fund
          npm run build:hosting
      - name: Assemble standalone Android APK
        run: gradle --no-daemon -p android-app :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bsk-standalone-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
