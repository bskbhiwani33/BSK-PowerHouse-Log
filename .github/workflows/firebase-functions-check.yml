name: BSK Firebase Functions Validation

on:
  push:
    branches:
      - bsk-complete-update-prep
  pull_request:
    branches:
      - main

jobs:
  validate-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Firebase and package configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "const p=JSON.parse(require('fs').readFileSync('functions/package.json','utf8')); if(p.engines.node!=='22') process.exit(1)"
      - name: Check JavaScript syntax
        run: |
          node --check api-config.js
          node --check app.js
          node --check sw.js
          node --check functions/index.js
          node --check functions/handlers/login.mjs
          node --check functions/handlers/admin.mjs
          node --check functions/handlers/create-admin.mjs
          node --check functions/handlers/records.mjs
      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
